# Local full stack: Postgres + API + web app.   docker compose up --build   ->  http://localhost:5173
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deliverylens
      POSTGRES_PASSWORD: deliverylens
      POSTGRES_DB: deliverylens
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliverylens"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://deliverylens:deliverylens@db:5432/deliverylens
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_FAST: ${BEDROCK_MODEL_FAST:-}
      BEDROCK_MODEL_SMART: ${BEDROCK_MODEL_SMART:-}
      CORS_ORIGINS: http://localhost:5173
    command: sh -c "python -m app.loader --if-empty && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [api]
