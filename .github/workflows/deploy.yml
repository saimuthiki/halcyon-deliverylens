name: Deploy to AWS

# Runs after CI passes on main: every push to main updates the live API (EC2) and website (Amplify).
# No GitHub secrets are needed: GitHub signs in to AWS with OIDC (role deliverylens-github-deploy,
# trusted for this repository's main branch only), and the API is restarted through Systems Manager, not SSH.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "781547812451"
  DEPLOY_ROLE: arn:aws:iam::781547812451:role/deliverylens-github-deploy
  ECR_REPO: deliverylens-api
  EC2_INSTANCE_ID: i-0cb69a787b44017c0
  API_URL: https://35-175-32-49.sslip.io
  AMPLIFY_APP_ID: d19tzovsk3zuvo
  AMPLIFY_BRANCH: main
  SITE_URL: https://main.d19tzovsk3zuvo.amplifyapp.com

jobs:
  api:
    # Only a successful CI run for a real push to main in this repository deploys. A pull request (even from a
    # fork branch named "main") also runs CI, so the event and the head repository are checked as well.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build and push the API image to ECR
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -f backend/Dockerfile -t "$REGISTRY/$ECR_REPO:$SHA" -t "$REGISTRY/$ECR_REPO:latest" .
          docker push "$REGISTRY/$ECR_REPO:$SHA"
          docker push "$REGISTRY/$ECR_REPO:latest"
      - name: Restart the API on EC2 with the new image (Systems Manager)
        run: |
          # Runs as root on the server: refresh app.env from Secrets Manager, then pull and restart the API.
          cat > remote.sh <<'SH'
          set -euo pipefail
          cd /home/ec2-user
          set -a; . ./.env; set +a
          # SMTP_* stay out of app.env: the API reads them itself from the secret (APP_SECRET_ID, boto3, instance role).
          trap 'rm -f /home/ec2-user/app.env.tmp' EXIT
          (umask 077
           aws secretsmanager get-secret-value --region "$AWS_REGION" --secret-id "$SECRET_NAME" --query SecretString \
             --output text | jq -r 'to_entries[] | select(.key | startswith("SMTP_") | not) | "\(.key)=\(.value)"' > app.env.tmp
           printf 'APP_SECRET_ID=%s\nAPP_SECRET_ACCOUNT=%s\n' "$SECRET_NAME" "${IMAGE%%.*}" >> app.env.tmp
           # Client links (address confirmation) open the API's own page: the website has a login.
           printf 'PUBLIC_API_URL=%s\n' "__API_URL__" >> app.env.tmp)
          mv app.env.tmp app.env && chmod 600 app.env && chown ec2-user app.env
          aws ecr get-login-password --region "$AWS_REGION" | sudo -u ec2-user docker login --username AWS --password-stdin "${IMAGE%%/*}"
          sudo -u ec2-user docker compose -f docker-compose.prod.yml pull api
          sudo -u ec2-user docker compose -f docker-compose.prod.yml up -d api
          # Reload the sample order inbox from the new image (data loads only if the database is empty).
          for i in $(seq 1 12); do
            sudo -u ec2-user docker compose -f docker-compose.prod.yml exec -T api python -m app.loader --if-empty && break
            sleep 5
          done
          docker image prune -f
          SH
          sed -i "s#__API_URL__#$API_URL#" remote.sh
          CMD_ID=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "$(jq -n --rawfile s remote.sh '{commands: [$s]}')" \
            --query Command.CommandId --output text)
          echo "SSM command $CMD_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success) break ;; Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -20
          [ "$STATUS" = Success ] || { echo "Deploy command ended with $STATUS"; exit 1; }
      - name: Smoke test
        run: |
          for i in $(seq 1 12); do curl -fsS "$API_URL/api/health" && exit 0; sleep 10; done
          echo "API did not become healthy"; exit 1

  website:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the website against the live API
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.API_URL }}
        run: |
          npm ci
          npm run build
          cd dist && zip -qr ../../site.zip .
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload to Amplify
        run: |
          read -r JOB_ID URL < <(aws amplify create-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --query '[jobId,zipUploadUrl]' --output text)
          curl -fsS -X PUT -H "Content-Type: application/zip" --upload-file site.zip "$URL"
          aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" --job-id "$JOB_ID" >/dev/null
          for i in $(seq 1 60); do
            STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" --job-id "$JOB_ID" \
              --query job.summary.status --output text)
            case "$STATUS" in SUCCEED) echo "Website live: $SITE_URL"; exit 0 ;; FAILED|CANCELLED) echo "Amplify job $STATUS"; exit 1 ;; esac
            sleep 5
          done
          echo "Amplify job still $STATUS"; exit 1
