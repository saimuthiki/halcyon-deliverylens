name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt || true
      - name: Unit and API tests
        run: python -m pytest -q --junitxml=../evidence/backend-junit.xml
      - name: Security scan (bandit + pip-audit)
        run: |
          pip install bandit pip-audit
          bandit -q -r app -x app/tests -ll
          pip-audit -r requirements.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: evidence/backend-junit.xml

  backend-postgres:
    # Same suite against PostgreSQL 16 (production runs on RDS PostgreSQL).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deliverylens
          POSTGRES_PASSWORD: deliverylens
          POSTGRES_DB: deliverylens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deliverylens -d deliverylens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only credentials for the throwaway service container.
      DATABASE_URL: postgresql+psycopg://deliverylens:deliverylens@localhost:5432/deliverylens_test
      TEST_DATABASE_URL: postgresql+psycopg://deliverylens:deliverylens@localhost:5432/deliverylens_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit and API tests on PostgreSQL
        run: python -m pytest -q --junitxml=../evidence/backend-postgres-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-postgres-test-results
          path: evidence/backend-postgres-junit.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high || true

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Re-run the root-cause analysis and check the headline numbers
        run: |
          python analysis/root_cause_analysis.py > /dev/null
          python - <<'PY'
          import json
          f = json.load(open("analysis/output/findings.json"))
          assert f["on_time_rate_today"] == 0.71, f["on_time_rate_today"]
          assert f["on_time_if_all_fixed"] == 0.99, f["on_time_if_all_fixed"]
          assert f["on_time_realistic"] == 0.9024, f["on_time_realistic"]
          print("analysis numbers reproduced")
          PY
