            - generic [ref=f3e415]:
              - generic [ref=f3e416]: Email to the client, for review
              - generic [ref=f3e417]: "Your deliveries from Halcyon: what we found and what will change"
              - generic [ref=f3e418]: "Dear Client 263 team, You have had too many late deliveries from us: 193 of 747 in the last six months. We have looked at every one of them and found the causes. We would like 30 minutes with you to walk through what we found and what will change: - A named Customer Success contact and a weekly on-time report for the next 90 days. - A delay alert from us on any shipment at risk of being late, before you have to chase it. - Every email order will be checked for a full address before picking; a missing detail is filled from your delivery history and you confirm it with one click. - Your deliveries will go with the best on-time carrier for your region, never a weak lane. - Same-day orders that arrive shortly after 08:00 will still go on that day's pick list, and urgent ones until the hard stop. Please reply with a time that suits you this week. Kind regards, Your Halcyon Logistics account team DRAFT: for the account owner to review before anything is sent."
            - paragraph [ref=f3e419]: Facts, causes, the projected on-time rate and the commitments come from the data and fixed rules; the AI writes the wording. Any number not in the facts sends the plan back to the template.
      - region [ref=f3e420]:
        - heading "What these clients have in common" [level=2] [ref=f3e421]
        - paragraph [ref=f3e422]: Weak carrier on lane is a main cause for 9 of the 9 accounts. These clients also raised 24 of the 34 complaints in the period. Across all clients, 12 complaints were about not being told about a delay. A proactive delay alert costs almost nothing to send and removes that complaint entirely.