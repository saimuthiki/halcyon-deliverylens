<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#F3F5F4;color:#15212B;font-family:Arial,Helvetica,sans-serif;">
<div style="display:none;max-height:0;overflow:hidden;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3F5F4;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px;background:#FFFFFF;border:1px solid #D9DFDD;border-radius:8px;">
        <tr>
          <td style="padding:20px 28px;border-bottom:3px solid #0E6B63;">
            <div style="font-size:18px;font-weight:bold;color:#0E6B63;">DeliveryLens</div>
            <div style="font-size:13px;color:#5E6B75;">Halcyon Logistics</div>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 28px;font-size:15px;line-height:1.5;">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:16px 28px;border-top:1px solid #D9DFDD;font-size:12px;line-height:1.5;color:#5E6B75;">
            {% block footer %}Sent by DeliveryLens.{% endblock %}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
